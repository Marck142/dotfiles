# --- Переключение между файлами в папке ---
N playlist-next             # Следующий файл в папке
P playlist-prev             # Предыдущий файл в папке
Ctrl+RIGHT playlist-next    # Следующий файл по Ctrl + Стрелка вправо
Ctrl+LEFT  playlist-prev    # Предыдущий файл по Ctrl + Стрелка влево

# --- Просмотр списка файлов ---
F8 script-binding osd-playlist # Показать текущий плейлист на экране

# --- Навигация и громкость ---
RIGHT seek 5                # Перемотка на 5 сек вперед
LEFT  seek -5               # Перемотка на 5 сек назад
UP    add volume 5          # Громкость +5%
DOWN  add volume -5         # Громкость -5%
SPACE cycle pause           # Пауза / Пуск
f     cycle fullscreen      # Полноэкранный режим
